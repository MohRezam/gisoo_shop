services:

  db:
    image: postgres:17
    container_name: gisoo_center_db
    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: gisoo_center_redis
    restart: always

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  web:
    build: .

    container_name: gisoo_center_web

    restart: always

    command:
      - gunicorn
      - core_gisoo_backend.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"

    env_file:
      - .env


    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy


  celery:
    build: .

    container_name: gisoo_center_celery

    restart: always

    command:
      - celery
      - -A
      - config
      - worker
      - -l
      - info

    env_file:
      - .env


    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy


  nginx:
    image: nginx:alpine

    container_name: gisoo_center_nginx

    restart: always

    depends_on:
      - web

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro


volumes:
  postgres_data:
  staticfiles:
  media: