services:
  db:
    image: postgres:17
    container_name: gisoo_center_db
    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - gisoo_network

  redis:
    image: redis:7-alpine
    container_name: gisoo_center_redis
    restart: always

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - gisoo_network

  web:
    build: .
    container_name: gisoo_center_web
    restart: always

    command:
      - gunicorn
      - core_gisoo_backend.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --worker-class
      - gthread
      - --workers
      - "2"
      - --threads
      - "2"
      - --timeout
      - "60"
      - --max-requests
      - "500"
      - --max-requests-jitter
      - "50"
      - --keep-alive
      - "5"

    env_file:
      - .env

    volumes:
      - staticfiles:/app/static
      - media:/app/media

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - gisoo_network

  celery:
    build: .
    container_name: gisoo_center_celery
    restart: always

    command:
      - celery
      - -A
      - core_gisoo_backend
      - worker
      - -l
      - info
      - --concurrency
      - "1"

    env_file:
      - .env

    environment:
      SKIP_ENTRYPOINT_SETUP: "1"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - gisoo_network



  celery-beat:
    build: .
    container_name: gisoo_center_celery_beat
    restart: always

    command:
      - celery
      - -A
      - core_gisoo_backend
      - beat
      - -l
      - info
      - --scheduler
      - django_celery_beat.schedulers:DatabaseScheduler

    env_file:
      - .env

    environment:
      SKIP_ENTRYPOINT_SETUP: "1"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - gisoo_network


  nginx:
    image: nginx:alpine
    container_name: gisoo_center_nginx
    restart: always

    depends_on:
      - web

    ports:
      - "127.0.0.1:81:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/static:ro
      - media:/app/media:ro

    networks:
      - gisoo_network

networks:
  gisoo_network:
    driver: bridge

volumes:
  postgres_data:
  staticfiles:
  media: