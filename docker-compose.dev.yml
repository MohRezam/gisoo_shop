services:

  db:
    image: postgres:17
    container_name: gisoo_shop_db

    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

    container_name: online_shop_redis

    restart: always

    ports:
      - "6379:6379"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    build: .

    container_name: gisoo_shop_celery

    restart: always

    command: celery -A core_gisoo_backend worker -l info

    env_file:
      - .env

    environment:
      SKIP_ENTRYPOINT_SETUP: "1"

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine

    container_name: online_shop_nginx

    restart: always

    depends_on:
      - web

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/static:ro
      - media:/app/media:ro

  web:
    build: .

    container_name: online_shop_web

    restart: always

    command: gunicorn core_gisoo_backend.wsgi:application --bind 0.0.0.0:8000 --worker-class gthread --workers 2 --threads 2 --timeout 60 --max-requests 500 --max-requests-jitter 50

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - staticfiles:/app/static
      - media:/app/media


    ports:
      - "8000:8000"

volumes:
  postgres_data:
  staticfiles:
  media: